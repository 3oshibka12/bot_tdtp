services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dating
      POSTGRES_PASSWORD: dating123
      POSTGRES_DB: dating_bot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  celery_beat:
    build: .
    command: celery -A tasks.celery_app beat --loglevel=info
    depends_on:
      - rabbitmq
    restart: always

  celery_worker:
    build: .
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=1
    depends_on:
      - rabbitmq
      - postgres
    restart: always

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - bot

  bot:
    build: .
    command: python main.py
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    restart: always

    

volumes:
  postgres_data:
  minio_data: