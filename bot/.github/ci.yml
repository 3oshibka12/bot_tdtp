name: Dating Bot CI
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install aiogram sqlalchemy redis celery
        
    - name: Check architecture and syntax (Flake8)
      run: |
        pip install flake8
        # Проверяем код на ошибки (останавливаем билд если есть критичные)
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics